<script>
const $=id=>document.getElementById(id);
// ---------- home background: animated EEG waves over a brain-glow gradient
const bg=$('bg'),bx=bg.getContext('2d');
function fit(c){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;c.getContext('2d').setTransform(d,0,0,d,0,0);return[r.width,r.height]}

for(let k=0;k<7;k++){bx.beginPath();bx.strokeStyle=`hsla(${170+k*14},90%,60%,${.16+k*.04})`;bx.lineWidth=1.5;
for(let x=0;x<w;x+=3){const y=h*(.25+k*.09)+Math.sin(x*.012*(k+1)+t/700*(1+k*.2))*18+Math.sin(x*.05+t/300+k)*6;x?bx.lineTo(x,y):bx.moveTo(x,y)}bx.stroke()}
requestAnimationFrame(drawBg)}
requestAnimationFrame(drawBg);
// ---------- flow control

const cv=$('cv'),cx=cv.getContext('2d');

const log=(m,c='')=>{const d=document.createElement('div');d.className=c;d.textContent=m;$('log').appendChild(d);$('log').scrollTop=1e9};

const ov=(h)=>{$('ov').style.display=h?'block':'none';$('ov').innerHTML=h||''};
const ttl=t=>$('title').textContent=t;
function loop(t){if(W){cx.setTransform(devicePixelRatio||1,0,0,devicePixelRatio||1,0,0);cx.clearRect(0,0,W,H);cx.fillStyle='#050b18';cx.fillRect(0,0,W,H);

scene(t)}requestAnimationFrame(loop)}requestAnimationFrame(loop);

// ---------- helpers

// ---------- scenes
const CH=['Fp1','C3','Cz','C4','O1'];
function sRaw(t){const n=CH.length,exp=Math.min(1,sp*1.3);ttl('① RAW EEG ACQUISITION');

cx.fillStyle='#7f95bd';cx.fillText('Fs = 250 Hz · 5 channels · reading samples: '+Math.floor(sp*15000),50,H-150)}
const BANDS=[['Delta','0.5–4 Hz',2],['Theta','4–8 Hz',6],['Alpha','8–13 Hz',10.5],['Beta','13–30 Hz',21.5],['Gamma','30–45 Hz',37]];

function sScan(t){ttl('② FREQUENCY SPECTRUM SCAN');const bw=(W-100)/5,base=H-190,sx=50+sp*(W-100);
BANDS.forEach((b,i)=>{const x=50+i*bw,seen=sx>x+bw/2,chosen=seen&&sp>.95&&i==3,hh=(H-330)*bandH[i]*(seen?1:.25)*(.95+.05*Math.sin(t/120+i));

cx.fillStyle=chosen?'#22e0c4':'#9fb3d9';cx.font='13px sans-serif';cx.textAlign='center';cx.fillText(b[0],x+bw/2,base+20);cx.font='11px sans-serif';cx.fillStyle='#7f95bd';cx.fillText(b[1],x+bw/2,base+36)});
cx.textAlign='left';const g=cx.createLinearGradient(sx-50,0,sx,0);g.addColorStop(0,'#22e0c400');g.addColorStop(1,'#22e0c455');cx.fillStyle=g;cx.fillRect(sx-50,60,50,base-60);
cx.fillStyle='#22e0c4';cx.fillRect(sx-1,60,2,base-60);
if(sp>.95){cx.fillStyle='#22e0c4';cx.font='bold 15px sans-serif';cx.textAlign='center';cx.fillText('★ BETA (13–30 Hz) selected — motor imagery activity',W/2,60)}cx.textAlign='left'}
function sFilt(t){ttl('③ BANDPASS FILTER · BETA EXTRACTION');const bx0=W/2-50,bw=100,by=H*.2,bh=H*.55,mid=H*.47;
cx.strokeStyle='#ff6b7a';cx.lineWidth=1;cx.beginPath();
for(let x=20;x<bx0;x+=2){const y=mid+eegSig(x-t/6,t)*30;x==20?cx.moveTo(x,y):cx.lineTo(x,y)}cx.stroke();
cx.strokeStyle='#22e0c4';cx.lineWidth=2.2;cx.beginPath();
for(let x=bx0+bw;x<W-20;x+=2){const y=H*.3+Math.sin((x+t/5)*.14)*22*Math.min(1,sp*2);x==bx0+bw?cx.moveTo(x,y):cx.lineTo(x,y)}cx.stroke();
cx.fillStyle='#ff6b7a';for(let i=0;i<45;i++){const px=bx0+bw+((i*53+t/6)%(W-bx0-bw-30)),py=H*.66+((i*37)%70)+Math.sin(t/200+i)*4;cx.globalAlpha=Math.min(1,sp*2)*.8;cx.fillRect(px,py,3,3)}cx.globalAlpha=1;
cx.fillStyle='#0d1c38';cx.strokeStyle='#22e0c4';cx.lineWidth=2;cx.fillRect(bx0,by,bw,bh);cx.strokeRect(bx0,by,bw,bh);
cx.fillStyle='#22e0c4';cx.font='13px sans-serif';cx.textAlign='center';cx.fillText('BPF 13–30 Hz',W/2,by+22);
cx.fillStyle='#ff6b7a';cx.fillText('Noise & artefacts removed ↓',W*.75,H*.62);cx.fillStyle='#22e0c4';cx.fillText('Clean beta waves →',W*.75,H*.2);
cx.fillStyle='#7f95bd';cx.fillText('Raw EEG',bx0/2,H*.28);cx.textAlign='left'}
function wheel(x,y,r,rot){cx.strokeStyle='#22e0c4';cx.lineWidth=3;cx.beginPath();cx.arc(x,y,r,0,7);cx.stroke();cx.lineWidth=1.5;for(let i=0;i<6;i++){const a=rot+i*Math.PI/3;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);cx.stroke()}}
function sWheel(t){ttl('④ INITIALISING WHEELCHAIR CONTROL');const px=60+sp*(W-260),gy=H*.5+70,rot=px/24;
cx.strokeStyle='#2b4270';cx.lineWidth=3;cx.beginPath();cx.moveTo(0,gy);cx.lineTo(W,gy);cx.stroke();
cx.save();cx.translate(px,0);cx.strokeStyle='#22e0c4';cx.lineWidth=5;cx.lineCap='round';
cx.beginPath();cx.moveTo(30,gy-115);cx.lineTo(34,gy-52);cx.lineTo(100,gy-52);cx.lineTo(112,gy-20);cx.stroke();
cx.fillStyle='#6ea8ff';cx.beginPath();cx.arc(56,gy-150,15,0,7);cx.fill();
cx.strokeStyle='#6ea8ff';cx.beginPath();cx.moveTo(56,gy-133);cx.lineTo(56,gy-78);cx.lineTo(102,gy-72);cx.lineTo(110,gy-30);cx.stroke();
cx.beginPath();cx.moveTo(56,gy-120);cx.lineTo(90,gy-100);cx.stroke();
wheel(50,gy-30,30,rot);wheel(118,gy-12,12,rot*2);
cx.strokeStyle='#ffc85788';cx.lineWidth=2;for(let i=0;i<3;i++){const a=(t/300+i)%3;cx.beginPath();cx.arc(56,gy-150,22+a*12,-2.3,-.8);cx.stroke()}cx.restore();
cx.fillStyle='#1b2c4d';cx.fillRect(60,H-150,W-120,10);cx.fillStyle='#22e0c4';cx.fillRect(60,H-150,(W-120)*sp,10);
cx.fillStyle='#9fb3d9';cx.font='13px sans-serif';cx.fillText('Loading BCI module… '+Math.floor(sp*100)+'%',60,H-160)}
let WIN=2;
function sWin(t){ttl('⑤ EPOCHING · WINDOW = '+WIN+' s');const top=90,hh=H-330,n=Math.max(2,Math.min(8,Math.floor(20/WIN))),ww=(W-100)/n,mid=top+hh/2,shown=sp*(W-100);
cx.strokeStyle='#22e0c4';cx.lineWidth=1.8;cx.beginPath();for(let x=0;x<shown;x+=2){const y=mid+Math.sin(x*.16)*hh*.28*(1+.3*Math.sin(x*.02));x?cx.lineTo(50+x,y):cx.moveTo(50+x,y)}cx.stroke();
for(let i=0;i<n;i++){const x=50+i*ww;if(x+ww<50+shown+1){cx.fillStyle=i%2?'#6ea8ff22':'#22e0c422';cx.fillRect(x,top,ww,hh);cx.strokeStyle='#6ea8ff';cx.setLineDash([5,4]);cx.strokeRect(x,top,ww,hh);cx.setLineDash([]);cx.fillStyle='#9fb3d9';cx.font='12px sans-serif';cx.textAlign='center';cx.fillText('W'+(i+1)+' · '+WIN+'s',x+ww/2,top+hh+18)}}
cx.textAlign='left';cx.fillStyle='#7f95bd';cx.fillText('time (s) →',50,top+hh+38)}
let FS=250;
function sNyq(t){ttl('⑥ NYQUIST FREQUENCY');const mid=H*.4,a=Math.min(1,sp*1.5);cx.strokeStyle='#2b4270';cx.beginPath();cx.moveTo(40,mid);cx.lineTo(W-40,mid);cx.stroke();
cx.strokeStyle='#22e0c4';cx.lineWidth=2;cx.beginPath();for(let x=40;x<W-40;x++){const y=mid-Math.sin(x*.05+t/300)*70;x>40?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke();
cx.fillStyle='#ffc857';for(let x=40;x<(W-80)*a+40;x+=12){const y=mid-Math.sin(x*.05+t/300)*70;cx.beginPath();cx.arc(x,y,3.5,0,7);cx.fill();cx.strokeStyle='#ffc85744';cx.beginPath();cx.moveTo(x,mid);cx.lineTo(x,y);cx.stroke()}}
// LDA
const R=(()=>{let s=7;return()=>{s=(s*16807)%2147483647;return s/2147483647}})();const G=()=>Math.sqrt(-2*Math.log(R()+1e-9))*Math.cos(6.283*R());
const PT=[];for(let i=0;i<70;i++){const c=i%2,a=G()*.9,b=G()*.35;PT.push({c,x:(c?1.3:-1.3)+a*.9-b*.5,y:(c?.7:-.7)+a*.5+b})}
let ldaStep=1,LD;
function calcLDA(){const g=[[],[]];PT.forEach(p=>g[p.c].push(p));
const m=g.map(a=>[a.reduce((t,p)=>t+p.x,0)/a.length,a.reduce((t,p)=>t+p.y,0)/a.length]);
let a=0,b=0,c=0;g.forEach((arr,k)=>arr.forEach(p=>{const dx=p.x-m[k][0],dy=p.y-m[k][1];a+=dx*dx;b+=dx*dy;c+=dy*dy}));

const thr=.5*(w[0]*(m[0][0]+m[1][0])+w[1]*(m[0][1]+m[1][1]));
return{g,m,a,b,c,det,inv,d,w,thr}}
function sLda(t){ttl('⑦ LDA · STEP '+ldaStep+' / 5');const cX=W/2,cY=H*.3,s=Math.min(W,H)*.1,nw=Math.hypot(...LD.w),ux=LD.w[0]/nw,uy=LD.w[1]/nw;
const P=(p)=>{let x=p.x,y=p.y;if(ldaStep>=5){const d=x*ux+y*uy,q=Math.min(1,sp*1.2);x=x+(d*ux-x)*q;y=y+(d*uy-y)*q}return[cX+x*s,cY+y*s]};
const[m0,m1]=LD.m;
if(ldaStep>=4){cx.strokeStyle='#ffc857';cx.lineWidth=2;const L=Math.min(1,ldaStep==4?sp:1)*s*3.2;cx.beginPath();cx.moveTo(cX-ux*L,cY-uy*L);cx.lineTo(cX+ux*L,cY+uy*L);cx.stroke();cx.fillStyle='#ffc857';cx.font='13px sans-serif';cx.fillText('w',cX+ux*L+6,cY+uy*L)}
if(ldaStep>=3){[[m0,'#6ea8ff'],[m1,'#22e0c4']].forEach(e=>{cx.strokeStyle=e[1];cx.lineWidth=1.5;cx.setLineDash([6,4]);cx.beginPath();cx.ellipse(cX+e[0][0]*s,cY+e[0][1]*s,s*(.6+.6*Math.min(1,ldaStep==3?sp:1)),s*.9,.6,0,7);cx.stroke();cx.setLineDash([])})}
PT.forEach(p=>{const[x,y]=P(p);cx.fillStyle=p.c?'#22e0c4':'#6ea8ff';cx.beginPath();cx.arc(x,y,3.5,0,7);cx.fill()});
if(ldaStep>=2){[[m0,'μ₁'],[m1,'μ₂']].forEach(m=>{const x=cX+m[0][0]*s,y=cY+m[0][1]*s;cx.fillStyle='#ffc857';cx.fillRect(x-6,y-6,12,12);cx.fillStyle='#fff';cx.font='bold 13px sans-serif';cx.fillText(m[1],x+9,y-9)})}
if(ldaStep==5){const dd=LD.thr/nw,bx=cX+ux*dd*s,by=cY+uy*dd*s;cx.strokeStyle='#ff6b7a';cx.lineWidth=2;cx.setLineDash([4,4]);cx.beginPath();cx.moveTo(bx-uy*s*2.5,by+ux*s*2.5);cx.lineTo(bx+uy*s*2.5,by-ux*s*2.5);cx.stroke();cx.setLineDash([]);cx.fillStyle='#ff6b7a';cx.font='12px sans-serif';cx.fillText('decision boundary y = c',bx+8,by-s*2.5)}
cx.fillStyle='#6ea8ff';cx.fillRect(20,40,10,10);cx.fillStyle='#9fb3d9';cx.font='12px sans-serif';cx.fillText('Left-hand',36,49);cx.fillStyle='#22e0c4';cx.fillRect(100,40,10,10);cx.fillStyle='#9fb3d9';cx.fillText('Right-hand',116,49)}
// road navigation
const PLAN=['R','L','L','R','L'];
const RC={x:0,y:0,ang:0,cmd:'S',trail:[],pts:[],dec:[]};
function buildPath(){let x=0,y=0,dx=1,dy=0;const pts=[[0,0]];PLAN.forEach(c=>{x+=2*dx;y+=2*dy;pts.push([x,y]);[dx,dy]=c=='L'?[dy,-dx]:[-dy,dx]});x+=2*dx;y+=2*dy;pts.push([x,y]);return pts}
function sRoad(t){ttl('⑨ WHEELCHAIR NAVIGATION · LDA COMMANDS');const pts=RC.pts;if(!pts.length)return;
const xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]),mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);
const sc=Math.min((W-140)/(mxx-mnx),(H-330)/(mxy-mny)),ox=(W-(mxx-mnx)*sc)/2-mnx*sc,oy=90+((H-330)-(mxy-mny)*sc)/2-mny*sc,M=(a,b)=>[ox+a*sc,oy+b*sc];
cx.fillStyle='#0a1a17';for(let i=-1;i<8;i++)for(let j=-3;j<6;j++){const[a,b]=M(i+.6,j+.6);cx.fillRect(a,b,sc*.8,sc*.8)}

path(sc*.42,'#3a4b73');path(sc*.36,'#222d47');path(2,'#ffc857',[12,10]);

// ---------- pipeline

const ok=()=>{if(my!==tok)return rej('x');const n=parseFloat($('wi').value);if(n>0)res(n)};$('wb').onclick=ok;$('wi').onkeydown=e=>e.key=='Enter'&&ok();$('wi').focus()});

const N=Math.round(WIN*FS);
scene=sNyq;sp=0;ov(`<div>Sampling rate <b>Fs = ${FS} Hz</b> · window = ${WIN} s → <b>${N}</b> samples/window</div><div class="f">f<sub>N</sub> = Fs / 2 = ${FS} / 2 = <b>${FS/2} Hz</b></div><div>Beta max (30 Hz) &lt; ${FS/2} Hz ✔ no aliasing</div>`);
log(`[6/7] Nyquist frequency = Fs/2 = ${FS/2} Hz`);await prog(4500);log('✔ Nyquist criterion satisfied','ok');ov();
log('[7/7] Applying Linear Discriminant Analysis…');scene=sLda;
LD=calcLDA();const f=n=>(n<0?'−':'')+Math.abs(n).toFixed(2),f3=n=>(n<0?'−':'')+Math.abs(n).toFixed(3),V=(v,q=f)=>`[${q(v[0])}, ${q(v[1])}]ᵀ`,G0=LD.g[0],G1=LD.g[1],[m0,m1]=LD.m,d=LD.d,w=LD.w,I=LD.inv;
const tp=G1[2],ty=w[0]*tp.x+w[1]*tp.y;
const F=[
['Feature matrix X loaded (35 Left + 35 Right windows)',`<div><b>Step 1 · Feature vectors</b> — N = 70 windows, N₁ = 35 (Left), N₂ = 35 (Right)</div><div class="f">x = [log var(C3), log var(C4)]ᵀ<br>Left: ${V([G0[0].x,G0[0].y])} ${V([G0[1].x,G0[1].y])} …<br>Right: ${V([G1[0].x,G1[0].y])} ${V([G1[1].x,G1[1].y])} …</div>`],
['Class means computed: μ₁='+V(m0)+' μ₂='+V(m1),`<div><b>Step 2 · Class means</b> μₖ = (1/Nₖ) Σ xᵢ</div><div class="f">μ₁ = (1/35)·${V([m0[0]*35,m0[1]*35])} = ${V(m0)}<br>μ₂ = (1/35)·${V([m1[0]*35,m1[1]*35])} = ${V(m1)}<br>μ₂ − μ₁ = ${V(d)}</div>`],
['Within-class scatter Sw computed',`<div><b>Step 3 · Within-class scatter</b></div><div class="f">S<sub>w</sub> = Σₖ Σ (xᵢ−μₖ)(xᵢ−μₖ)ᵀ<br>= [[${f(LD.a)}, ${f(LD.b)}], [${f(LD.b)}, ${f(LD.c)}]]</div>`],
['w = Sw⁻¹(μ₂−μ₁) = '+V(w,f3),`<div><b>Step 4 · Between-class scatter & projection vector</b></div><div class="f">S<sub>b</sub> = (μ₂−μ₁)(μ₂−μ₁)ᵀ = [[${f(d[0]*d[0])}, ${f(d[0]*d[1])}], [${f(d[0]*d[1])}, ${f(d[1]*d[1])}]]<br>det S<sub>w</sub> = ${f(LD.a)}·${f(LD.c)} − ${f(LD.b)}² = ${f(LD.det)}<br>S<sub>w</sub>⁻¹ = [[${f3(I[0][0])}, ${f3(I[0][1])}], [${f3(I[1][0])}, ${f3(I[1][1])}]]<br>w = S<sub>w</sub>⁻¹(μ₂−μ₁) = ${V(w,f3)}</div>`],
['Projected y = wᵀx, threshold c = '+f3(LD.thr),`<div><b>Step 5 · Projection & threshold</b></div><div class="f">c = ½ wᵀ(μ₁+μ₂) = ${f3(LD.thr)}<br>test x = ${V([tp.x,tp.y])} → y = (${f3(w[0])})(${f(tp.x)}) + (${f3(w[1])})(${f(tp.y)}) = ${f3(ty)}<br>y ${ty>LD.thr?'>':'<'} c → class = <b>${ty>LD.thr?'RIGHT hand':'LEFT hand'}</b></div>`]];
for(let i=0;i<5;i++){ldaStep=i+1;ov(F[i][1]);await prog(5000);log('  LDA '+(i+1)+'/5 ✔ '+F[i][0],'ok')}

ov(`<div><b>Final results</b> · LDA on beta-band features</div><div class="res">${TR.map(r=>`<div>${r.n}<b>${r.a.toFixed(1)}%</b></div>`).join('')}</div>`);

const ct=[0,0];
for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];RC.cmd='F';ov('<div>Moving <b>▲ FORWARD</b> '+(i<PLAN.length?'to junction J'+(i+1):'to the goal')+'…</div>');log('  ▲ FORWARD','m');
await anim(2000,q=>{RC.x=a[0]+(b[0]-a[0])*q;RC.y=a[1]+(b[1]-a[1])*q;RC.trail.push([RC.x,RC.y])});RC.cmd='S';
if(i<PLAN.length){const want=PLAN[i]=='L'?0:1,arr=LD.g[want];let pt,y;do{pt=arr[ct[want]++%arr.length];y=w[0]*pt.x+w[1]*pt.y}while((y>LD.thr?1:0)!==want);
const pred=y>LD.thr?1:0,cmd=pred?'R':'L';
ov(`<div><b>Junction J${i+1}</b> · ${WIN}s EEG window → beta features x = ${V([pt.x,pt.y])}</div><div class="f">y = wᵀx = (${f3(w[0])})(${f(pt.x)}) + (${f3(w[1])})(${f(pt.y)}) = ${f3(y)}<br>y ${pred?'>':'<'} c (${f3(LD.thr)}) → <b>${pred?'RIGHT-hand imagery → TURN RIGHT ▶':'LEFT-hand imagery → TURN LEFT ◀'}</b></div>`);
log(`  J${i+1}: y=${f3(y)} ${pred?'>':'<'} c=${f3(LD.thr)} → ${pred?'RIGHT':'LEFT'}`,'w');await sleep(2800);
RC.cmd=cmd;RC.dec[i]=cmd;const a0=RC.ang;await anim(1000,q=>{RC.ang=a0+(cmd=='L'?-1:1)*Math.PI/2*q})}}
RC.cmd='S';ov('<div><b>■ STOP</b> — Destination reached. ✔ All '+PLAN.length+' turns executed correctly from LDA-decoded EEG commands.</div>');log('✔ Destination reached. Wheelchair stopped.','ok');$('st').textContent='finished';
}catch(e){if(e!=='x')console.error(e)}}
